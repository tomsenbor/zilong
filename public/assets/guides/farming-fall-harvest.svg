<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">秋季收获：两种现金节奏</title><desc id="desc">原创攻略示意，非游戏截图。蔓越莓｜秋 1 播种：每粒 240 金，一次购种；蔓越莓｜五次收获：秋 8 / 13 / 18 / 23 / 28；南瓜｜秋 1 播种：每粒 100 金，秋 14 首收；南瓜｜秋 14 当天补种：再付一轮种子钱，秋 27 收获</desc><rect width="480" height="460" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">秋季收获：两种现金节奏</text><rect x="24" y="60" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="87" font-size="21" font-weight="700">蔓越莓｜秋 1 播种</text><text x="40" y="114" font-size="18">每粒 240 金，一次购种</text><path d="M240 132v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="146" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="173" font-size="21" font-weight="700">蔓越莓｜五次收获</text><text x="40" y="200" font-size="18">秋 8 / 13 / 18 / 23 / 28</text><path d="M240 218v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="232" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="259" font-size="21" font-weight="700">南瓜｜秋 1 播种</text><text x="40" y="286" font-size="18">每粒 100 金，秋 14 首收</text><path d="M240 304v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="318" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="345" font-size="21" font-weight="700">南瓜｜秋 14 当天补种</text><text x="40" y="372" font-size="18">再付一轮种子钱，秋 27 收获</text><text x="24" y="425" font-size="16">无加速、每日浇水；首次投入 ≠ 整轮成本</text><text x="24" y="449" font-size="14" fill="#7b684e">原创示意 · 非游戏截图 · 条件与来源见正文</text></g></svg>
