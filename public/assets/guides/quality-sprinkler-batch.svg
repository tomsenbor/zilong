<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img" aria-labelledby="title"><title id="title">10 台优质洒水器：材料账</title><rect width="480" height="510" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">10 台优质洒水器：材料账</text><text x="24" y="72" font-size="16">示例采用普通石英熔炼；不含熔炉成本</text><rect x="24" y="95" width="432" height="89" rx="3" fill="#d7e8cc" stroke="#7c795d"/><text x="42" y="129" font-size="22">铁矿石 50 + 煤炭 10</text><text x="42" y="162" font-size="22">熔炼 → 铁锭 10</text><rect x="24" y="200" width="432" height="89" rx="3" fill="#d7e8cc" stroke="#7c795d"/><text x="42" y="234" font-size="22">金矿石 50 + 煤炭 10</text><text x="42" y="267" font-size="22">熔炼 → 金锭 10</text><rect x="24" y="305" width="432" height="89" rx="3" fill="#d7e8cc" stroke="#7c795d"/><text x="42" y="339" font-size="22">石英 10 + 煤炭 10</text><text x="42" y="372" font-size="22">熔炼 → 精炼石英 10</text><text x="24" y="432" font-size="22">合计煤炭 30；耕种 6 级制作</text><text x="24" y="474" font-size="22">10 台 × 每台 8 格 = 80 格作物</text></g></svg>
