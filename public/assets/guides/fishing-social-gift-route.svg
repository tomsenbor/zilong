<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">送礼：库存 → 对象 → 当天日程</title><desc id="desc">站内原创流程示意，非游戏截图。特殊物品与配偶另有规则；查不到最爱不代表讨厌。</desc><rect x="2" y="2" width="956" height="536" rx="16" fill="#fff8e8" stroke="#6a3518" stroke-width="4"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="36" y="50" font-size="30" font-weight="700">送礼：库存 → 对象 → 当天日程</text><rect x="36" y="80" width="888" height="106" rx="8" fill="#d7e8cc" stroke="#7c795d" stroke-width="2"/><text x="58" y="112" font-size="25" font-weight="700">① 提前 2–3 天</text><text x="58" y="147" font-size="23">查生日、个人喜好</text><text x="58" y="174" font-size="20">首份献祭物与任务物先隔离</text><rect x="36" y="202" width="888" height="106" rx="8" fill="#f6e4b9" stroke="#7c795d" stroke-width="2"/><text x="58" y="234" font-size="25" font-weight="700">② 当天出门前</text><text x="58" y="269" font-size="23">只带本路线需要的礼物</text><text x="58" y="296" font-size="20">确认天气、住所和特殊日程</text><rect x="36" y="324" width="888" height="106" rx="8" fill="#d7e8cc" stroke="#7c795d" stroke-width="2"/><text x="58" y="356" font-size="25" font-weight="700">③ 交谈后赠礼</text><text x="58" y="391" font-size="23">普通礼物每日一次、每周两次</text><text x="58" y="418" font-size="20">周日重置；生日可突破周上限</text><text x="36" y="474" font-size="21">特殊物品与配偶另有规则；查不到最爱不代表讨厌。</text><text x="36" y="513" font-size="20" fill="#7b684e">本站绘制 · 示意图，非游戏截图 · 原版 1.6 攻略辅助</text></g></svg>
