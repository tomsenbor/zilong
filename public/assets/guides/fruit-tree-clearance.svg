<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" role="img" aria-labelledby="title"><title id="title">果树幼苗：先检查八邻格</title><rect width="480" height="420" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">果树幼苗：先检查八邻格</text><text x="24" y="70" font-size="16">局部间距示意 · 不是 18 棵果树定位图</text><rect x="140" y="95" width="64" height="64" rx="3" fill="#d7e8cc" stroke="#7c795d"/><rect x="206" y="95" width="64" height="64" rx="3" fill="#d7e8cc" stroke="#7c795d"/><rect x="272" y="95" width="64" height="64" rx="3" fill="#d7e8cc" stroke="#7c795d"/><rect x="140" y="161" width="64" height="64" rx="3" fill="#d7e8cc" stroke="#7c795d"/><rect x="206" y="161" width="64" height="64" rx="3" fill="#315c45" stroke="#7c795d"/><text x="222" y="198" font-size="24" fill="#fff">树</text><rect x="272" y="161" width="64" height="64" rx="3" fill="#d7e8cc" stroke="#7c795d"/><rect x="140" y="227" width="64" height="64" rx="3" fill="#d7e8cc" stroke="#7c795d"/><rect x="206" y="227" width="64" height="64" rx="3" fill="#d7e8cc" stroke="#7c795d"/><rect x="272" y="227" width="64" height="64" rx="3" fill="#d7e8cc" stroke="#7c795d"/><text x="24" y="330" font-size="21">绿色邻格：清理玩家放置的障碍</text><text x="24" y="365" font-size="20">固有墙、木边不等同于玩家障碍</text><text x="24" y="397" font-size="18">另检查树间距；不要种在温室角落</text></g></svg>
