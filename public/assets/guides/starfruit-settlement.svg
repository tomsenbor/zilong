<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title"><title id="title">同一批杨桃，三种独立方案</title><rect width="480" height="480" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">同一批杨桃，三种独立方案</text><text x="24" y="70" font-size="17">10 格 / 28 天 / 每种设备 1 台 / 无职业</text><rect x="24" y="93" width="432" height="95" rx="3" fill="#d7e8cc" stroke="#7c795d"/><text x="42" y="127" font-size="23">直接出售：20 个原果</text><text x="42" y="165" font-size="21">15,000 − 8,000 = 7,000 金</text><rect x="24" y="204" width="432" height="95" rx="3" fill="#d7e8cc" stroke="#7c795d"/><text x="42" y="238" font-size="21">罐头瓶：6 份成品 + 14 个原果</text><text x="42" y="276" font-size="21">19,800 − 8,000 = 11,800 金</text><rect x="24" y="315" width="432" height="95" rx="3" fill="#d7e8cc" stroke="#7c795d"/><text x="42" y="349" font-size="21">小桶：2 份成品 + 18 个原果</text><text x="42" y="387" font-size="21">18,000 − 8,000 = 10,000 金</text><text x="24" y="448" font-size="19">按工具截止日估值；不是实际回收原料</text></g></svg>
