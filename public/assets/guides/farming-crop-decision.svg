<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">选作物：四步核对</title><desc id="desc">原创攻略示意，非游戏截图。① 图鉴：能否种、能否买：季节 / 来源 / 生长 / 棚架；② 固定比较条件：相同日期、地点、地块和职业；③ 分开两种费用：首次投入 vs 整轮补种成本；④ 检查是否能执行：浇水能力 / 样本 / 加工容量</desc><rect width="480" height="460" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">选作物：四步核对</text><rect x="24" y="60" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="87" font-size="21" font-weight="700">① 图鉴：能否种、能否买</text><text x="40" y="114" font-size="18">季节 / 来源 / 生长 / 棚架</text><path d="M240 132v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="146" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="173" font-size="21" font-weight="700">② 固定比较条件</text><text x="40" y="200" font-size="18">相同日期、地点、地块和职业</text><path d="M240 218v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="232" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="259" font-size="21" font-weight="700">③ 分开两种费用</text><text x="40" y="286" font-size="18">首次投入 vs 整轮补种成本</text><path d="M240 304v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="318" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="345" font-size="21" font-weight="700">④ 检查是否能执行</text><text x="40" y="372" font-size="18">浇水能力 / 样本 / 加工容量</text><text x="24" y="425" font-size="16">收益数字不是绕过来源和劳动限制的许可</text><text x="24" y="449" font-size="14" fill="#7b684e">原创示意 · 非游戏截图 · 条件与来源见正文</text></g></svg>
