<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">季节专题：按问题选入口</title><desc id="desc">原创攻略示意，非游戏截图。缺钱 → 季节赚钱路线：看首次投入与首收时间；缺物 → 清单 + 查询器：先看收集包，再匹配获取条件；缺效率 → 背包 / 矿井 / 设备：区分容量、体力与材料瓶颈；季末 → 下一季准备：记录样本、设备覆盖与可用现金</desc><rect width="480" height="460" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">季节专题：按问题选入口</text><rect x="24" y="60" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="87" font-size="21" font-weight="700">缺钱 → 季节赚钱路线</text><text x="40" y="114" font-size="18">看首次投入与首收时间</text><path d="M240 132v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="146" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="173" font-size="21" font-weight="700">缺物 → 清单 + 查询器</text><text x="40" y="200" font-size="18">先看收集包，再匹配获取条件</text><path d="M240 218v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="232" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="259" font-size="21" font-weight="700">缺效率 → 背包 / 矿井 / 设备</text><text x="40" y="286" font-size="18">区分容量、体力与材料瓶颈</text><path d="M240 304v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="318" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="345" font-size="21" font-weight="700">季末 → 下一季准备</text><text x="40" y="372" font-size="18">记录样本、设备覆盖与可用现金</text><text x="24" y="425" font-size="16">导航示意：选当前问题，不必一天做完所有项</text><text x="24" y="449" font-size="14" fill="#7b684e">原创示意 · 非游戏截图 · 条件与来源见正文</text></g></svg>
