<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">夏季收获：先看等待期</title><desc id="desc">原创攻略示意，非游戏截图。蓝莓｜夏 1 播种：首次要生长 13 天；蓝莓｜夏 14 / 18 / 22 / 26：4 次收获，每株每次基础 3 果；甜瓜｜夏 1 播种：夏 13 收获后，当天补种；甜瓜｜夏 25 再收：两轮需购种两次</desc><rect width="480" height="460" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">夏季收获：先看等待期</text><rect x="24" y="60" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="87" font-size="21" font-weight="700">蓝莓｜夏 1 播种</text><text x="40" y="114" font-size="18">首次要生长 13 天</text><path d="M240 132v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="146" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="173" font-size="21" font-weight="700">蓝莓｜夏 14 / 18 / 22 / 26</text><text x="40" y="200" font-size="18">4 次收获，每株每次基础 3 果</text><path d="M240 218v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="232" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="259" font-size="21" font-weight="700">甜瓜｜夏 1 播种</text><text x="40" y="286" font-size="18">夏 13 收获后，当天补种</text><path d="M240 304v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="318" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="345" font-size="21" font-weight="700">甜瓜｜夏 25 再收</text><text x="40" y="372" font-size="18">两轮需购种两次</text><text x="24" y="425" font-size="16">无加速、每日浇水、成熟当天采收</text><text x="24" y="449" font-size="14" fill="#7b684e">原创示意 · 非游戏截图 · 条件与来源见正文</text></g></svg>
