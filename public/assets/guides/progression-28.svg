<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc"><title id="title">四个操作节点，对应四种工具</title><desc id="desc">原创攻略流程示意图，非游戏实机截图。买种子前 → 算预算与收获日；出门钓鱼前 → 筛天气时间地点；交献祭后 → 更新本地清单；卖陌生物品前 → 查详情用途</desc><rect width="480" height="390" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei,sans-serif" fill="#382b1d"><text x="22" y="36" font-size="21" font-weight="700">四个操作节点，对应四种工具</text><text x="22" y="62" font-size="14" fill="#7b684e">攻略示意 · 非实机截图 · 以正文前置条件为准</text><rect x="22" y="82" width="436" height="52" rx="4" fill="#d7e8cc" stroke="#7c795d"/><text x="36" y="114" font-size="17">1. 买种子前 → 算预算与收获日</text><rect x="22" y="150" width="436" height="52" rx="4" fill="#fff1c9" stroke="#7c795d"/><text x="36" y="182" font-size="17">2. 出门钓鱼前 → 筛天气时间地点</text><rect x="22" y="218" width="436" height="52" rx="4" fill="#d7e8cc" stroke="#7c795d"/><text x="36" y="250" font-size="17">3. 交献祭后 → 更新本地清单</text><rect x="22" y="286" width="436" height="52" rx="4" fill="#fff1c9" stroke="#7c795d"/><text x="36" y="318" font-size="17">4. 卖陌生物品前 → 查详情用途</text><text x="22" y="376" font-size="14" fill="#7b684e">星露谷物语中文攻略站 · 原创路径整理</text></g></svg>
