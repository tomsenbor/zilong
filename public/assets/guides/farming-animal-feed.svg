<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">冬季干草：按动物数预算</title><desc id="desc">原创攻略示意，非游戏截图。4 只 × 28 天：预留 112 份干草；8 只 × 28 天：预留 224 份干草；1 座满筒仓｜240 份：可覆盖 8 只的整季保守预算；12 只 × 28 天｜336 份：超过一仓，另备 96 份以上</desc><rect width="480" height="460" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">冬季干草：按动物数预算</text><rect x="24" y="60" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="87" font-size="21" font-weight="700">4 只 × 28 天</text><text x="40" y="114" font-size="18">预留 112 份干草</text><path d="M240 132v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="146" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="173" font-size="21" font-weight="700">8 只 × 28 天</text><text x="40" y="200" font-size="18">预留 224 份干草</text><path d="M240 218v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="232" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="259" font-size="21" font-weight="700">1 座满筒仓｜240 份</text><text x="40" y="286" font-size="18">可覆盖 8 只的整季保守预算</text><path d="M240 304v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="318" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="345" font-size="21" font-weight="700">12 只 × 28 天｜336 份</text><text x="40" y="372" font-size="18">超过一仓，另备 96 份以上</text><text x="24" y="425" font-size="16">按每只每天 1 份；自动喂食仍需库存</text><text x="24" y="449" font-size="14" fill="#7b684e">原创示意 · 非游戏截图 · 条件与来源见正文</text></g></svg>
