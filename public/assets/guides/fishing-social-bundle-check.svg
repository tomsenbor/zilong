<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">献祭前：确认同一条需求</title><desc id="desc">站内原创流程示意，非游戏截图。示例：品质作物选四组中的三组；不是四种各交一个。</desc><rect x="2" y="2" width="956" height="536" rx="16" fill="#fff8e8" stroke="#6a3518" stroke-width="4"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="36" y="50" font-size="30" font-weight="700">献祭前：确认同一条需求</text><rect x="36" y="80" width="888" height="106" rx="8" fill="#d7e8cc" stroke="#7c795d" stroke-width="2"/><text x="58" y="112" font-size="25" font-weight="700">① 看当前存档</text><text x="58" y="147" font-size="23">标准包与混合包先分清</text><text x="58" y="174" font-size="20">看物品名称、数量和品质</text><rect x="36" y="202" width="888" height="106" rx="8" fill="#f6e4b9" stroke="#7c795d" stroke-width="2"/><text x="58" y="234" font-size="25" font-weight="700">② 对照库存</text><text x="58" y="269" font-size="23">金星作物是 5 个一组</text><text x="58" y="296" font-size="20">可选包按指定种类数准备</text><rect x="36" y="324" width="888" height="106" rx="8" fill="#d7e8cc" stroke="#7c795d" stroke-width="2"/><text x="58" y="356" font-size="25" font-weight="700">③ 进游戏提交后再勾选</text><text x="58" y="391" font-size="23">网站不读取游戏存档</text><text x="58" y="418" font-size="20">换设备前导出进度备份</text><text x="36" y="474" font-size="21">示例：品质作物选四组中的三组；不是四种各交一个。</text><text x="36" y="513" font-size="20" fill="#7b684e">本站绘制 · 示意图，非游戏截图 · 原版 1.6 攻略辅助</text></g></svg>
