<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">冬季 7 天作物：三轮示意</title><desc id="desc">原创攻略示意，非游戏截图。冬 1 播种 → 冬 8 收：第一轮；收后当天补种；冬 8 播种 → 冬 15 收：第二轮；收后当天补种；冬 15 播种 → 冬 22 收：第三轮；检查季末窗口；冬 22 再种？：需到下一季，不能算冬 28 收成</desc><rect width="480" height="460" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">冬季 7 天作物：三轮示意</text><rect x="24" y="60" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="87" font-size="21" font-weight="700">冬 1 播种 → 冬 8 收</text><text x="40" y="114" font-size="18">第一轮；收后当天补种</text><path d="M240 132v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="146" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="173" font-size="21" font-weight="700">冬 8 播种 → 冬 15 收</text><text x="40" y="200" font-size="18">第二轮；收后当天补种</text><path d="M240 218v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="232" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="259" font-size="21" font-weight="700">冬 15 播种 → 冬 22 收</text><text x="40" y="286" font-size="18">第三轮；检查季末窗口</text><path d="M240 304v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="318" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="345" font-size="21" font-weight="700">冬 22 再种？</text><text x="40" y="372" font-size="18">需到下一季，不能算冬 28 收成</text><text x="24" y="425" font-size="16">无加速、不断水；种子实际到手日另算</text><text x="24" y="449" font-size="14" fill="#7b684e">原创示意 · 非游戏截图 · 条件与来源见正文</text></g></svg>
