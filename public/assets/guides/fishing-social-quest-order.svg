<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">特别订单：两条进度都要核对</title><desc id="desc">站内原创流程示意，非游戏截图。旧库存交进箱子，不会自动满足“新收集”计数。</desc><rect x="2" y="2" width="956" height="536" rx="16" fill="#fff8e8" stroke="#6a3518" stroke-width="4"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="36" y="50" font-size="30" font-weight="700">特别订单：两条进度都要核对</text><rect x="36" y="80" width="888" height="106" rx="8" fill="#d7e8cc" stroke="#7c795d" stroke-width="2"/><text x="58" y="112" font-size="25" font-weight="700">① 接取前</text><text x="58" y="147" font-size="23">看剩余天数和获得能力</text><text x="58" y="174" font-size="20">周一上新，不是接取后重新计时</text><rect x="36" y="202" width="888" height="106" rx="8" fill="#f6e4b9" stroke="#7c795d" stroke-width="2"/><text x="58" y="234" font-size="25" font-weight="700">② 接取后</text><text x="58" y="269" font-size="23">按要求新收集／新收获</text><text x="58" y="296" font-size="20">再交付、捐入指定箱或出货</text><rect x="36" y="324" width="888" height="106" rx="8" fill="#d7e8cc" stroke="#7c795d" stroke-width="2"/><text x="58" y="356" font-size="25" font-weight="700">③ 截止前</text><text x="58" y="391" font-size="23">逐项看任务日志</text><text x="58" y="418" font-size="20">完成条件与奖励领取分开检查</text><text x="36" y="474" font-size="21">旧库存交进箱子，不会自动满足“新收集”计数。</text><text x="36" y="513" font-size="20" fill="#7b684e">本站绘制 · 示意图，非游戏截图 · 原版 1.6 攻略辅助</text></g></svg>
