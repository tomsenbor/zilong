<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">20 格草莓：现金流</title><desc id="desc">原创攻略示意，非游戏截图。春 13｜买种并播种：20 × 100 = 2,000 金投入；春 21｜第一次收获：20 × 120 = 2,400 金基础收入；春 25｜第二次收获：20 × 120 = 2,400 金基础收入；两收结算｜扣除种子：4,800 − 2,000 = 2,800 金</desc><rect width="480" height="460" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">20 格草莓：现金流</text><rect x="24" y="60" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="87" font-size="21" font-weight="700">春 13｜买种并播种</text><text x="40" y="114" font-size="18">20 × 100 = 2,000 金投入</text><path d="M240 132v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="146" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="173" font-size="21" font-weight="700">春 21｜第一次收获</text><text x="40" y="200" font-size="18">20 × 120 = 2,400 金基础收入</text><path d="M240 218v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="232" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="259" font-size="21" font-weight="700">春 25｜第二次收获</text><text x="40" y="286" font-size="18">20 × 120 = 2,400 金基础收入</text><path d="M240 304v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="318" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="345" font-size="21" font-weight="700">两收结算｜扣除种子</text><text x="40" y="372" font-size="18">4,800 − 2,000 = 2,800 金</text><text x="24" y="425" font-size="16">无加速、普通品质、不断水；不计额外产出</text><text x="24" y="449" font-size="14" fill="#7b684e">原创示意 · 非游戏截图 · 条件与来源见正文</text></g></svg>
