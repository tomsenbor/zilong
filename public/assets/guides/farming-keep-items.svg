<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">献祭库存：分用途计数</title><desc id="desc">原创攻略示意，非游戏截图。普通季节作物包：每种样本各 1；已交的不再留；品质作物包：四组选三组，每组 5 个金星；饲料包：小麦 10 + 干草 10 + 苹果 3；同名物品，不同提交：工匠包若选苹果，另加 1 个</desc><rect width="480" height="460" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">献祭库存：分用途计数</text><rect x="24" y="60" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="87" font-size="21" font-weight="700">普通季节作物包</text><text x="40" y="114" font-size="18">每种样本各 1；已交的不再留</text><path d="M240 132v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="146" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="173" font-size="21" font-weight="700">品质作物包</text><text x="40" y="200" font-size="18">四组选三组，每组 5 个金星</text><path d="M240 218v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="232" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="259" font-size="21" font-weight="700">饲料包</text><text x="40" y="286" font-size="18">小麦 10 + 干草 10 + 苹果 3</text><path d="M240 304v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="318" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="345" font-size="21" font-weight="700">同名物品，不同提交</text><text x="40" y="372" font-size="18">工匠包若选苹果，另加 1 个</text><text x="24" y="425" font-size="16">标准收集包示意；不含全部料理和任务</text><text x="24" y="449" font-size="14" fill="#7b684e">原创示意 · 非游戏截图 · 条件与来源见正文</text></g></svg>
