<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">背包：容量与付款</title><desc id="desc">原创攻略示意，非游戏截图。初始背包：12 格，不增加额外体力；第一次升级｜+12 格：付 2,000 金 → 共 24 格；第二次升级｜再 +12 格：付 10,000 金 → 共 36 格；预算先分用途：种子钱 + 背包费 + 日常备用</desc><rect width="480" height="460" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">背包：容量与付款</text><rect x="24" y="60" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="87" font-size="21" font-weight="700">初始背包</text><text x="40" y="114" font-size="18">12 格，不增加额外体力</text><path d="M240 132v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="146" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="173" font-size="21" font-weight="700">第一次升级｜+12 格</text><text x="40" y="200" font-size="18">付 2,000 金 → 共 24 格</text><path d="M240 218v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="232" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="259" font-size="21" font-weight="700">第二次升级｜再 +12 格</text><text x="40" y="286" font-size="18">付 10,000 金 → 共 36 格</text><path d="M240 304v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="318" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="345" font-size="21" font-weight="700">预算先分用途</text><text x="40" y="372" font-size="18">种子钱 + 背包费 + 日常备用</text><text x="24" y="425" font-size="16">需要逐级升级；36 格累计花费 12,000 金</text><text x="24" y="449" font-size="14" fill="#7b684e">原创示意 · 非游戏截图 · 条件与来源见正文</text></g></svg>
