<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">成熟果园：对齐周产量</title><desc id="desc">原创攻略示意，非游戏截图。20 株成熟远古水果：每 7 天产 20 个果实；现有 5 桶｜按周装取：一轮只能接 5 个果实；剩余 15 个：明确直售或入库，不算成品酒；目标约 20 桶：匹配每周 20 果的固定装取节奏</desc><rect width="480" height="460" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">成熟果园：对齐周产量</text><rect x="24" y="60" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="87" font-size="21" font-weight="700">20 株成熟远古水果</text><text x="40" y="114" font-size="18">每 7 天产 20 个果实</text><path d="M240 132v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="146" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="173" font-size="21" font-weight="700">现有 5 桶｜按周装取</text><text x="40" y="200" font-size="18">一轮只能接 5 个果实</text><path d="M240 218v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="232" width="432" height="70" rx="5" fill="#d7e8cc" stroke="#7c795d"/><text x="40" y="259" font-size="21" font-weight="700">剩余 15 个</text><text x="40" y="286" font-size="18">明确直售或入库，不算成品酒</text><path d="M240 304v10m-4-4 4 4 4-4" fill="none" stroke="#6a3518" stroke-width="2"/><rect x="24" y="318" width="432" height="70" rx="5" fill="#f5e6be" stroke="#7c795d"/><text x="40" y="345" font-size="21" font-weight="700">目标约 20 桶</text><text x="40" y="372" font-size="18">匹配每周 20 果的固定装取节奏</text><text x="24" y="425" font-size="16">这是周排程示意，不是分钟级极限模型</text><text x="24" y="449" font-size="14" fill="#7b684e">原创示意 · 非游戏截图 · 条件与来源见正文</text></g></svg>
