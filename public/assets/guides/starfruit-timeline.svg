<svg xmlns="http://www.w3.org/2000/svg" width="480" height="475" viewBox="0 0 480 475" role="img" aria-labelledby="title"><title id="title">十格杨桃：28 天种植时间线</title><rect width="480" height="475" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei, sans-serif" fill="#382b1d"><text x="24" y="38" font-size="23" font-weight="700">十格杨桃：28 天种植时间线</text><text x="24" y="72" font-size="18">夏 1 开始 · 温室 · 无生长加速</text><rect x="24" y="95" width="432" height="88" rx="3" fill="#d7e8cc" stroke="#7c795d"/><text x="42" y="129" font-size="23">① 第 1 天：播种 10 粒</text><text x="42" y="162" font-size="20">首次种子支出 4,000 金</text><rect x="24" y="199" width="432" height="88" rx="3" fill="#d7e8cc" stroke="#7c795d"/><text x="42" y="233" font-size="21">② 第 14 天：收 10 个，再播种</text><text x="42" y="266" font-size="20">再投入 4,000 金</text><rect x="24" y="303" width="432" height="88" rx="3" fill="#d7e8cc" stroke="#7c795d"/><text x="42" y="337" font-size="23">③ 第 27 天：再收 10 个</text><text x="42" y="370" font-size="20">本轮不再补种；第 28 天结算</text><text x="24" y="436" font-size="21">共收 20 个；总种子成本 8,000 金</text></g></svg>
