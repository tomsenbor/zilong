<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc"><title id="title">成长路线导航：只找当前卡点</title><desc id="desc">原创攻略流程示意图，非游戏实机截图。没方向 → 第一周与全年总览；每天忙不过来 → 工具与体力；缺现金 → 赚钱；缺矿 → 资源；季节将结束 → 献祭与限定鱼</desc><rect width="480" height="390" rx="12" fill="#fff8e8"/><g font-family="Microsoft YaHei,sans-serif" fill="#382b1d"><text x="22" y="36" font-size="21" font-weight="700">成长路线导航：只找当前卡点</text><text x="22" y="62" font-size="14" fill="#7b684e">攻略示意 · 非实机截图 · 以正文前置条件为准</text><rect x="22" y="82" width="436" height="52" rx="4" fill="#d7e8cc" stroke="#7c795d"/><text x="36" y="114" font-size="17">1. 没方向 → 第一周与全年总览</text><rect x="22" y="150" width="436" height="52" rx="4" fill="#fff1c9" stroke="#7c795d"/><text x="36" y="182" font-size="17">2. 每天忙不过来 → 工具与体力</text><rect x="22" y="218" width="436" height="52" rx="4" fill="#d7e8cc" stroke="#7c795d"/><text x="36" y="250" font-size="17">3. 缺现金 → 赚钱；缺矿 → 资源</text><rect x="22" y="286" width="436" height="52" rx="4" fill="#fff1c9" stroke="#7c795d"/><text x="36" y="318" font-size="17">4. 季节将结束 → 献祭与限定鱼</text><text x="22" y="376" font-size="14" fill="#7b684e">星露谷物语中文攻略站 · 原创路径整理</text></g></svg>
